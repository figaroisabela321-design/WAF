openapi: 3.0.3
info:
  title: 政务 WAF 控制面 API
  description: |
    政务 WAF 安全防护平台 — Phase 1 控制面后端。
    基于 Coraza + OWASP CRS 架构愿景；本阶段仅提供站点/节点/策略/规则/认证/审计等管理 API。
  version: 1.0.0-phase1
servers:
  - url: http://localhost:8080
    description: Local
paths:
  /health:
    get:
      tags: [System]
      summary: Liveness (no DB)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /ready:
    get:
      tags: [System]
      summary: Readiness (ping Postgres)
      security: []
      responses:
        '200':
          description: Ready
        '503':
          description: DB unavailable
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /api/v1/sites:
    get:
      tags: [Sites]
      summary: List sites
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/page_size'
      responses:
        '200': { description: OK }
    post:
      tags: [Sites]
      summary: Create site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteCreate'
      responses:
        '200': { description: Created }
  /api/v1/sites/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Sites]
      summary: Get site
      responses:
        '200': { description: OK }
    put:
      tags: [Sites]
      summary: Update site
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteUpdate'
      responses:
        '200': { description: OK }
    delete:
      tags: [Sites]
      summary: Delete site
      responses:
        '200': { description: OK }
  /api/v1/nodes:
    get:
      tags: [Nodes]
      summary: List nodes
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/page_size'
      responses:
        '200': { description: OK }
    post:
      tags: [Nodes]
      summary: Create node
      responses:
        '200': { description: Created }
  /api/v1/nodes/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Nodes]
      summary: Get node
      responses:
        '200': { description: OK }
    put:
      tags: [Nodes]
      summary: Update node
      responses:
        '200': { description: OK }
  /api/v1/policies:
    get:
      tags: [Policies]
      summary: List policies
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/page_size'
      responses:
        '200': { description: OK }
    post:
      tags: [Policies]
      summary: Create policy
      responses:
        '200': { description: Created }
  /api/v1/policies/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Policies]
      summary: Get policy
      responses:
        '200': { description: OK }
    put:
      tags: [Policies]
      summary: Update policy
      responses:
        '200': { description: OK }
  /api/v1/rules:
    get:
      tags: [Rules]
      summary: List rules
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/page_size'
      responses:
        '200': { description: OK }
    post:
      tags: [Rules]
      summary: Create rule
      responses:
        '200': { description: Created }
  /api/v1/rules/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Rules]
      summary: Get rule
      responses:
        '200': { description: OK }
    put:
      tags: [Rules]
      summary: Update rule
      responses:
        '200': { description: OK }
    delete:
      tags: [Rules]
      summary: Delete rule
      responses:
        '200': { description: OK }
  /api/v1/users:
    get:
      tags: [Users]
      summary: List users
      responses:
        '200': { description: OK }
    post:
      tags: [Users]
      summary: Create user
      responses:
        '200': { description: Created }
  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Users]
      summary: Get user
      responses:
        '200': { description: OK }
    put:
      tags: [Users]
      summary: Update user
      responses:
        '200': { description: OK }
  /api/v1/roles:
    get:
      tags: [RBAC]
      summary: List roles
      responses:
        '200': { description: OK }
    post:
      tags: [RBAC]
      summary: Create role
      responses:
        '200': { description: Created }
  /api/v1/permissions:
    get:
      tags: [RBAC]
      summary: List permissions
      responses:
        '200': { description: OK }
  /api/v1/audit-logs:
    get:
      tags: [Audit]
      summary: List audit logs
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/page_size'
      responses:
        '200': { description: OK }
  /api/v1/events:
    get:
      tags: [Events]
      summary: List events (stub — ClickHouse not wired)
      responses:
        '200': { description: Empty list }
  /api/v1/alerts:
    get:
      tags: [Alerts]
      summary: List alerts (stub)
      responses:
        '200': { description: Empty list }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    page:
      name: page
      in: query
      schema: { type: integer, default: 1 }
    page_size:
      name: page_size
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
  schemas:
    Envelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: ok }
        data: {}
    SiteCreate:
      type: object
      required: [name, domain, upstream_port, protocol]
      properties:
        name: { type: string }
        domain: { type: string }
        upstream_host: { type: string }
        upstream_port: { type: integer, minimum: 1, maximum: 65535 }
        protocol: { type: string, enum: [http, https] }
        protection_mode: { type: string, enum: [observe, protect] }
        policy_id: { type: string, format: uuid, nullable: true }
        node_group_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [enabled, disabled] }
    SiteUpdate:
      type: object
      properties:
        name: { type: string }
        domain: { type: string }
        upstream_host: { type: string }
        upstream_port: { type: integer }
        protocol: { type: string, enum: [http, https] }
        protection_mode: { type: string, enum: [observe, protect] }
        policy_id: { type: string, nullable: true }
        node_group_id: { type: string, nullable: true }
        status: { type: string, enum: [enabled, disabled] }
security:
  - BearerAuth: []
