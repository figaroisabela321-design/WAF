# DEVELOPMENT ONLY — do not copy these passwords/secrets into production.
# Production must set APP_ENV=production with strong JWT_SECRET and ADMIN_PASSWORD
# that are NOT the documented development defaults.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: waf
      POSTGRES_PASSWORD: waf
      POSTGRES_DB: waf
    volumes:
      - waf_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waf -d waf"]
      interval: 5s
      timeout: 5s
      retries: 10

  waf-control:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://waf:waf@postgres:5432/waf?sslmode=disable"
      JWT_SECRET: "compose-dev-jwt-secret-change-me"
      JWT_EXPIRE_HOURS: "24"
      LOG_LEVEL: "info"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "Admin@123"
      TRUSTED_PROXIES: "127.0.0.1/32,10.0.0.0/8"
      # SWAGGER_ENABLED defaults on in development
    ports:
      - "8080:8080"

volumes:
  waf_pgdata:
